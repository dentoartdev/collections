<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dento Art">
<meta name="theme-color" content="#0a0a0a">
<title>Dento Art · My account</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0a0a0a;--card:#151515;--card2:#1c1c1c;--line:#262626;--gold:#dcbc6a;--gold2:#c9a227;--txt:#f4f1ea;--mut:#9a948a;--green:#3ecf8e;--orange:#f0a24a;--red:#ef5350;--onGold:#111}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}header img{height:30px}
.lang{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.hero{background:radial-gradient(120% 140% at 0% 0%,rgba(220,188,106,.10),transparent 55%),linear-gradient(160deg,#151515,#0d0d0d);border:1px solid var(--line);border-radius:22px;padding:18px}
.cn{font-size:13px;color:var(--mut);font-weight:700;letter-spacing:.4px}
.hl{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);font-weight:800;margin-top:12px}
.bal{font-size:clamp(30px,9vw,40px);font-weight:800;color:var(--gold);margin:4px 0 2px;direction:ltr;text-align:start;unicode-bidi:plaintext}
.bal small{font-size:15px;opacity:.85;margin-inline-end:6px}
.lp{font-size:12.5px;color:var(--mut)}.lp b{color:var(--txt)}
.pay{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--gold2),#e3c579);color:var(--onGold);font:inherit;font-weight:800;font-size:16px;padding:14px;cursor:pointer;text-decoration:none}
.pay small{display:block;font-size:11px;font-weight:700;opacity:.75}
.sec{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.sh{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);font-weight:800;margin-bottom:10px}
.mrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-size:13px;padding:3px 0}
.mrow .l{color:var(--mut);font-weight:700;white-space:nowrap;min-width:78px}.mrow .v{font-weight:800;direction:ltr;unicode-bidi:plaintext}
.bar{height:6px;background:var(--card2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:6px}
.inv{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:12px;padding:11px 12px;font:inherit;font-size:13.5px;margin-bottom:6px;cursor:pointer}
.inv .a{display:flex;align-items:center;gap:9px;min-width:0}.mo{font-size:11px;font-weight:800;color:var(--onGold);background:var(--gold);border-radius:7px;padding:3px 8px;white-space:nowrap}
.inv .no{color:var(--mut);font-weight:700;direction:ltr;white-space:nowrap}.inv .b{display:flex;align-items:center;gap:9px;white-space:nowrap}.inv em{font-style:normal;font-weight:800;direction:ltr;unicode-bidi:plaintext}.inv i{font-style:normal;color:var(--gold);font-weight:800}
.sts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st{border:0;background:var(--gold);color:var(--onGold);border-radius:12px;padding:10px 4px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.st small{display:block;font-size:9.5px;opacity:.7;letter-spacing:.8px}
.busy{opacity:.5;pointer-events:none}
.pay2{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:12px;padding:10px 12px;font:inherit;margin-bottom:6px;cursor:pointer;text-align:start}
.pt{display:flex;flex-direction:column;gap:2px}.pa{color:var(--green);font-size:15px;direction:ltr;unicode-bidi:plaintext}.pd{font-size:11.5px;color:var(--mut)}
.pc{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:11.5px}.pcl{color:var(--mut)}.pcl b{color:var(--txt)}.pc i{font-style:normal;color:var(--gold);font-weight:800}
.more{width:100%;border:1px dashed var(--line);background:transparent;color:var(--gold);border-radius:12px;padding:9px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
.tg{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;color:var(--mut);font:inherit;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;font-weight:800;padding:0;margin:0;cursor:pointer}
.tgl{color:var(--gold);letter-spacing:.3px;text-transform:none;font-size:12px}.sec .tg+.inv{margin-top:10px}
.mo.mg{background:var(--card);color:var(--mut);border:1px solid var(--line)}.ok{color:var(--green);font-weight:800;font-size:12px}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:6px 0}
.help{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--txt);text-decoration:none;font-weight:700;font-size:14px;background:var(--card)}
.help svg{width:18px;height:18px}
.ft{text-align:center;color:#666;font-size:11px;margin-top:18px}
.msg{color:var(--mut);text-align:center;padding:60px 10px;font-size:15px;line-height:1.7}
.paid{color:var(--green);font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="logo.png" alt="Dento Art"><button class="lang" id="lang">English</button></header>
  <div id="app"><div class="msg" id="msg">…</div></div>
  <div class="ft">Dento Art Dental Lab · DIFC, Dubai</div>
</div>
<script>
const FEED='https://script.google.com/macros/s/AKfycbxzrkpanri4fZax5EbZDgDj324CAkcneQMxe3Ylcl_zPMP-Covk_-vPUgUWB3EFsptOFg/exec';
const WA='971558699882';
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const qs=new URLSearchParams(location.search); let tok=qs.get('k')||store.get('ck')||''; if(qs.get('k')) store.set('ck',qs.get('k'));
let lang=store.get('cl_lang')||'ar', D=null; const cache={}, tog={};
const T={ar:{loading:'جاري تحميل حسابك…',bad:'الرابط غير صالح أو انتهى.<br>تواصل ويا Dento Art حتى نرسلك رابط جديد.',err:'تعذّر التحميل — تأكد من الإنترنت وحاول مرة ثانية.',bal:'الرصيد المستحق',last:'آخر دفعة',never:'لا توجد دفعات بعد',pay:'ادفع الآن',paySub:'دفع آمن عبر Mamo · أي مبلغ',months:'المستحق حسب الشهر',inv:'الفواتير المفتوحة',noinv:'لا توجد فواتير مفتوحة 🎉',st:'كشف الحساب',s3:'3 أشهر',sy:'هذه السنة',sf:'كامل',help:'تواصل معنا على واتساب',pays:'آخر الدفعات',closedInv:'الفواتير المسددة',closedOf:'سكّرت',rc:'إيصال',all:'عرض الكل',less:'عرض أقل',show:'عرض',hide:'إخفاء',paidTag:'مسددة',partial:'دفعة جزئية',m_mamo:'مامو',m_cash:'كاش',m_bank:'تحويل بنكي',m_cheque:'شيك',m_other:'دفعة',upd:'آخر تحديث',zero:'حسابك مسدّد بالكامل — شكراً لكم 🌷',other:'English'},
 en:{loading:'Loading your account…',bad:'This link is not valid or has expired.<br>Please contact Dento Art for a new link.',err:'Could not load — check the internet and try again.',bal:'Balance due',last:'Last payment',never:'No payments yet',pay:'Pay now',paySub:'Secure payment via Mamo · any amount',months:'Due by month',inv:'Open invoices',noinv:'No open invoices 🎉',st:'Statement of account',s3:'3 months',sy:'This year',sf:'Full',help:'Contact us on WhatsApp',pays:'Recent payments',closedInv:'Closed invoices',closedOf:'Closed',rc:'Receipt',all:'View all',less:'Show less',show:'Show',hide:'Hide',paidTag:'Paid',partial:'Part payment',m_mamo:'Mamo',m_cash:'Cash',m_bank:'Bank transfer',m_cheque:'Cheque',m_other:'Payment',upd:'Last update',zero:'Your account is fully paid — thank you 🌷',other:'العربية'}};
const t=k=>T[lang][k];
const fmt=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const MON={ar:['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function jsonp(url){ return new Promise((res,rej)=>{ const cb='cb'+Date.now()+Math.floor(Math.random()*1e4), s=document.createElement('script'); const tm=setTimeout(()=>{clean();rej(new Error('timeout'))},25000);
  function clean(){clearTimeout(tm);delete window[cb];s.remove()} window[cb]=d=>{clean();res(d)}; s.onerror=()=>{clean();rej(new Error('net'))}; s.src=url+'&callback='+cb; document.head.appendChild(s); }); }
function monthLabel(h){ const m=/^([A-Za-z]{3}) '(\d\d)$/.exec(h); if(!m) return h==='2025 & Older'?(lang==='ar'?'2025 وأقدم':'2025 & older'):h==='Unapplied Credit'?(lang==='ar'?'رصيد دائن':'Credit'):h;
  const i=MON.en.indexOf(m[1]); return (lang==='ar'?MON.ar[i]:m[1])+' 20'+m[2]; }
function docInfo(n){ const p=n.split('__'); if(p[1]&&/^statement-(3m|ytd|full)\.pdf$/.test(p[1])) return {k:p[1].slice(10,-4)};
  if(p[1]==='inv'&&p[2]) return {k:'i',no:p[2].replace(/\.pdf$/,''),ym:(p[3]||'').replace(/\.pdf$/,''),bal:p[4]?parseFloat(p[4]):null};
  if(p[1]==='paid'&&p[2]) return {k:'p',no:p[2],ym:p[3]||'',tot:parseFloat((p[4]||'0').replace(/\.pdf$/,''))};
  if(p[1]==='rcpt'&&p[2]) return {k:'r',id:p[2],date:p[3]||'',amt:parseFloat(p[4]||'0'),closed:(p[5]&&p[5]!=='0')?p[5].split('+'):[],m:(p[6]||'other').replace(/\.pdf$/,'')};
  return null; }
function render(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr'; $('#lang').textContent=t('other');
  if(!D) return; const c=D.clinic; const docs=(c.docs||[]).map(d=>({...d,...(docInfo(d.name)||{})}));
  const inv=docs.filter(d=>d.k==='i').sort((a,b)=>(a.ym||'').localeCompare(b.ym||'')), st=k=>docs.find(d=>d.k===k);
  const ms=(c.months||[]).filter(m=>m[1]>0), mx=Math.max(1,...ms.map(m=>m[1]));
  const lp=/invoiced/i.test(c.lastPayText||'')||!c.lastPay?t('never'):`${t('last')}: <b>${esc(c.lastPayText)}</b>`;
  let h=`<div class="hero"><div class="cn">${esc(c.name)}</div><div class="hl">${t('bal')}</div><div class="bal"><small>${c.cur}</small>${fmt(c.due)}</div><div class="lp">${lp}</div>
    ${c.due>0.004?(c.pay?`<a class="pay" href="${esc(c.pay)}" target="_blank" rel="noopener"><span>${t('pay')}<small>${t('paySub')}</small></span></a>`:''):`<div class="lp paid" style="margin-top:10px">${t('zero')}</div>`}</div>`;
  if(ms.length) h+=`<div class="sec"><div class="sh">${t('months')}</div>${ms.map(m=>`<div class="mrow"><span class="l">${monthLabel(m[0])}</span><span class="bar"><i style="width:${Math.max(4,Math.round(m[1]/mx*100))}%"></i></span><span class="v">${c.cur} ${fmt(m[1])}</span></div>`).join('')}</div>`;
  h+=`<div class="sec"><div class="sh">${t('inv')}${inv.length?' · '+inv.length:''}</div>`+(inv.length?inv.map(d=>{ const y=d.ym?(lang==='ar'?MON.ar:MON.en)[+d.ym.slice(5)-1]+' '+d.ym.slice(0,4):'';
    return `<button class="inv" data-f="${encodeURIComponent(d.name)}"><span class="a">${y?`<b class="mo">${y}</b>`:''}<span class="no">#${esc(String(d.no).split('-').pop())}</span></span><span class="b">${d.bal!=null?`<em>${c.cur} ${fmt(d.bal)}</em>`:''}<i>↓</i></span></button>`; }).join(''):`<div class="empty">${t('noinv')}</div>`)+`</div>`;
  const paid=docs.filter(d=>d.k==='p').sort((a,b)=>(b.ym||'').localeCompare(a.ym||'')), rc=docs.filter(d=>d.k==='r').sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));
  const ymOf={}; paid.concat(inv).forEach(d=>{ ymOf[String(d.no).split('-').pop()]=d.ym; });
  const ML=ym=>ym?(lang==='ar'?MON.ar:MON.en)[+ym.slice(5)-1]+' '+ym.slice(0,4):'';
  if(rc.length){ const show=tog.rc?rc:rc.slice(0,4);
    h+=`<div class="sec"><div class="sh">${t('pays')} · ${rc.length}</div>`+show.map(d=>`<button class="pay2" data-f="${encodeURIComponent(d.name)}"><span class="pt"><b class="pa">+${c.cur} ${fmt(d.amt)}</b><span class="pd">${d.date.split('-').reverse().join('/')} · ${t('m_'+d.m)}</span></span>
      <span class="pc">${d.closed.length?`<span class="pcl">${t('closedOf')}: ${d.closed.map(n=>`<b>#${n}</b>${ymOf[n]?' '+ML(ymOf[n]):''}`).join('، ')}</span>`:`<span class="pcl">${t('partial')}</span>`}<i>${t('rc')} ↓</i></span></button>`).join('')+
      (rc.length>4?`<button class="more" data-tog="rc">${tog.rc?t('less'):t('all')+' ('+rc.length+')'}</button>`:'')+`</div>`; }
  if(paid.length){ h+=`<div class="sec"><button class="sh tg" data-tog="pd"><span>${t('closedInv')} · ${paid.length}</span><span class="tgl">${tog.pd?t('hide'):t('show')}</span></button>`+
    (tog.pd?paid.map(d=>`<button class="inv" data-f="${encodeURIComponent(d.name)}"><span class="a">${d.ym?`<b class="mo mg">${ML(d.ym)}</b>`:''}<span class="no">#${esc(String(d.no).split('-').pop())}</span></span><span class="b"><em>${c.cur} ${fmt(d.tot)}</em><span class="ok">✓ ${t('paidTag')}</span><i>↓</i></span></button>`).join(''):'')+`</div>`; }
  if(st('3m')||st('ytd')||st('full')) h+=`<div class="sec"><div class="sh">${t('st')}</div><div class="sts">${[['3m','s3'],['ytd','sy'],['full','sf']].filter(([k])=>st(k)).map(([k,l])=>`<button class="st" data-f="${encodeURIComponent(st(k).name)}"><small>PDF</small>${t(l)}</button>`).join('')}</div></div>`;
  h+=`<a class="help" href="https://wa.me/${WA}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="#25d366"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3a.5.5 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>${t('help')}</a>`;
  if(D.synced){ const d=new Date(D.synced); h+=`<div class="ft" style="margin-top:12px">${t('upd')}: ${d.toLocaleString(lang==='ar'?'ar-AE':'en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>`; }
  $('#app').innerHTML=h;
}
async function openDoc(btn){ const f=decodeURIComponent(btn.dataset.f);
  try{ btn.classList.add('busy'); let file=cache[f];
    if(!file){ const d=await jsonp(FEED+'?ck='+encodeURIComponent(tok)+'&file='+encodeURIComponent(f)); if(!d.ok) throw new Error(d.error);
      const bin=atob(d.b64), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
      const i=docInfo(f), y=i&&i.ym?' ('+MON.en[+i.ym.slice(5)-1]+' '+i.ym.slice(0,4)+')':'';
      const nm=i&&(i.k==='i'||i.k==='p')?`Dento Art - Invoice ${i.no}${y}${i.k==='p'?' PAID':''}.pdf`:i&&i.k==='r'?`Dento Art - Receipt R-${i.id} (${i.date}).pdf`:`Dento Art - Statement (${({'3m':'3 months','ytd':'this year','full':'full'})[i&&i.k]||''}).pdf`;
      file=cache[f]=new File([u8],nm,{type:'application/pdf'}); }
    btn.classList.remove('busy');
    if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==='AbortError') return; } }
    const u=URL.createObjectURL(file), a=document.createElement('a'); a.href=u; a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000);
  }catch(e){ btn.classList.remove('busy'); alert(t('err')); } }
document.addEventListener('click',e=>{ const g=e.target.closest('[data-tog]'); if(g){ tog[g.dataset.tog]=!tog[g.dataset.tog]; render(); return; } const b=e.target.closest('[data-f]'); if(b){ e.preventDefault(); openDoc(b); } });
$('#lang').onclick=()=>{ lang=lang==='ar'?'en':'ar'; store.set('cl_lang',lang); if(D) render(); else $('#msg').innerHTML=t('loading'); };
async function load(){ render(); if(!tok){ $('#app').innerHTML=`<div class="msg">${t('bad')}</div>`; return; }
  if(!D) $('#app').innerHTML=`<div class="msg">${t('loading')}</div>`;
  try{ const d=await jsonp(FEED+'?ck='+encodeURIComponent(tok)); if(!d.ok){ $('#app').innerHTML=`<div class="msg">${t('bad')}</div>`; return; } D=d; render(); }
  catch(e){ if(!D) $('#app').innerHTML=`<div class="msg">${t('err')}</div>`; } }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
load();
</script>
</body>
</html>
