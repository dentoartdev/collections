<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dento Art · Collections</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Collections">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<script>try{if(localStorage.getItem("theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0a0a0a;--card:#151515;--card2:#1c1c1c;--line:#262626;--gold:#dcbc6a;--gold2:#c9a227;--txt:#f4f1ea;--mut:#9a948a;--green:#3ecf8e;--orange:#f0a24a;--red:#ef5350;--hero1:#141414;--hero2:#0d0d0d;--soft:rgba(255,255,255,.03);--glow:rgba(220,188,106,.06);--onGold:#111}
[data-theme=light]{--bg:#f6f5f2;--card:#ffffff;--card2:#f0eee9;--line:#e6e2d8;--gold:#a8811f;--gold2:#c9a227;--txt:#141414;--mut:#7c776d;--green:#15995c;--orange:#c46a10;--red:#d32f2f;--hero1:#ffffff;--hero2:#faf7ee;--soft:#fbf9f4;--glow:rgba(201,162,39,.10);--onGold:#fff}
[data-theme=light] .row,[data-theme=light] .hero,[data-theme=light] .tot{box-shadow:0 1px 2px rgba(0,0,0,.04)}
[data-theme=light] header img,[data-theme=light] .pin img{filter:brightness(.42) saturate(1.5)}
[data-theme=light] .chip.on{background:#141414;color:#f2d98e;border-color:#141414}
.th{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:15px;display:inline-flex;align-items:center;justify-content:center;margin-left:8px;cursor:pointer}
.hr{display:flex;align-items:center}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Segoe UI,Roboto,Arial,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}
header img{height:34px}
.upd{font-size:11px;color:var(--mut);text-align:right;line-height:1.4}
.upd b{color:var(--gold);font-weight:600}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--glow)}
.hl{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);font-weight:700}
.tots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
@media(max-width:620px){.tots{grid-template-columns:repeat(2,1fr)}}
.tot{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;transition:.2s}
.tot.on{border-color:var(--gold2);background:rgba(220,188,106,.08)}
.tot .c{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:1px}
.tot .v{font-size:clamp(14px,4.6vw,19px);font-weight:800;color:var(--gold);margin-top:3px;letter-spacing:-.3px;white-space:nowrap}
.tot .n{font-size:11px;color:var(--mut);margin-top:2px}
.strip{height:3px;border-radius:3px;background:linear-gradient(90deg,#a07a28,#f2dc9b 50%,#a07a28);margin:16px 0}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;color:var(--txt);font-size:15px;outline:none}
.search:focus{border-color:var(--gold2)}
.sorts{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--gold);color:var(--onGold);border-color:var(--gold)}
.list{display:flex;flex-direction:column;gap:9px}
.row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.nm{font-weight:700;font-size:15px;letter-spacing:.1px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:800;font-size:17px;color:var(--gold);text-align:right;white-space:nowrap}
.amt .aed{display:block;font-size:11px;font-weight:600;color:var(--mut);margin-top:1px;letter-spacing:.2px}
.aedt{font-size:10.5px;color:var(--mut);margin-top:3px;font-weight:600}
.amt small{font-size:11px;color:var(--mut);font-weight:700;margin-right:3px}
.meta{font-size:12.5px;color:var(--mut)}
.meta b{color:var(--txt);font-weight:600}
.badge{justify-self:end;font-size:11px;font-weight:800;border-radius:999px;padding:4px 9px;letter-spacing:.3px}
.g{background:rgba(62,207,142,.12);color:var(--green)}.o{background:rgba(240,162,74,.14);color:var(--orange)}.r{background:rgba(239,83,80,.15);color:var(--red)}
.empty,.msg{color:var(--mut);text-align:center;padding:40px 10px;font-size:14px}
.pin{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:9;padding:24px}
.pin img{height:46px}
.pin .t{color:var(--mut);font-size:13px;letter-spacing:2px;text-transform:uppercase}
.dots{display:flex;gap:14px}.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gold2)}.dot.f{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:26px;font-weight:500}
.pad button:active{background:var(--card2)}
.err{color:var(--red);font-size:13px;height:16px}
.shake{animation:sh .4s}@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(max-width:380px){.tots{gap:7px}.tot{padding:10px 9px}.amt{font-size:15.5px}}
.grand{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(100deg,#0d0d0d,#1d1a12);border:1px solid var(--gold2);border-radius:14px;padding:13px 15px}
[data-theme=light] .grand{background:linear-gradient(100deg,#141414,#2a2414)}
.grand .gl{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#c8c0ad;font-weight:700;line-height:1.5}.grand .gl small{display:block;letter-spacing:.3px;text-transform:none;font-weight:500;color:#8f8878;font-size:10.5px}
.grand .gv{font-size:clamp(18px,5.4vw,24px);font-weight:800;color:#e3c579;white-space:nowrap}.grand .gv small{font-size:12px;color:#b9a774;margin-right:4px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.tab{border:0;background:transparent;color:var(--mut);font-weight:700;font-size:13.5px;padding:10px;border-radius:10px;cursor:pointer}
.tab.on{background:var(--gold);color:var(--onGold)}
.mhero{background:linear-gradient(145deg,#0f2a24,#0b1a17);border:1px solid #1d4a3f;border-radius:18px;padding:16px;color:#eafaf4;margin-bottom:10px}
[data-theme=light] .mhero{background:linear-gradient(145deg,#e9f8f2,#f6fcf9);border-color:#bfe8d6;color:#0c3b2e}
.mhero .ml1{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;opacity:.75;font-weight:800}
.mhero .mv1{font-size:clamp(26px,8vw,34px);font-weight:800;margin:4px 0 2px;color:var(--green)}.mhero .mv1 small{font-size:14px;opacity:.8;margin-right:5px}
.mhero .ms{font-size:12px;opacity:.8}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}.mbox .k{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);font-weight:800}.mbox .v{font-size:17px;font-weight:800;margin-top:3px;white-space:nowrap}.mbox .v small{font-size:11px;color:var(--mut);margin-right:3px}
.payout{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:5px;font-size:13px}
.payout b{font-weight:800}.payout .pd{color:var(--mut);font-size:11.5px;margin-left:6px}.payout .pa{color:var(--green);font-weight:800;white-space:nowrap}
.row.mp{padding:8px 12px;border-radius:12px;gap:1px 10px}.row.mp .nm{font-size:14px}.row.mp .paid{font-size:14.5px}.row.mp .meta{font-size:11.5px;grid-column:1/-1}
.mst{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;border-radius:6px;padding:2px 6px}.mst.ok{background:rgba(62,207,142,.15);color:var(--green)}.mst.bad{background:rgba(239,83,80,.15);color:var(--red)}.mst.ref{background:rgba(240,162,74,.15);color:var(--orange)}
.grp{font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--mut);font-weight:800;margin:10px 2px 2px}
.paid{font-weight:800;font-size:16px;color:var(--green);text-align:right;white-space:nowrap}.paid small{font-size:11px;color:var(--mut);font-weight:700;margin-right:3px}
.rem{justify-self:end;font-size:12px;color:var(--mut);white-space:nowrap}.rem b{color:var(--gold);font-weight:800}
.row[data-n]{cursor:pointer}
.chev{display:inline-block;color:var(--gold);margin-right:6px;transition:transform .2s;font-weight:800}
.row.open .chev{transform:rotate(90deg)}
.det{grid-column:1/-1;display:none;margin-top:8px;padding-top:9px;border-top:1px dashed var(--line)}
.row.open .det{display:block;animation:in .25s ease both}
.mrow{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:10px;font-size:12.5px;padding:2.5px 0}
.ml{color:var(--mut);font-weight:600;white-space:nowrap}.mv{font-weight:700;text-align:right;white-space:nowrap}
.mb{height:6px;background:var(--card2);border-radius:6px;overflow:hidden}.mb i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:6px}
.mrow.cr .mv{color:var(--green)}
.dsum{font-size:11.5px;color:var(--mut);margin-top:5px}.dsum b{color:var(--txt)}
.docs{margin-top:12px}
.docs .dl{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);font-weight:800;margin:0 0 6px}
.docs .dl span{letter-spacing:0;text-transform:none;font-weight:600}
.sts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.doc{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.doc.st{border:0;background:var(--gold);color:var(--onGold);border-radius:12px;padding:9px 4px;font-size:12.5px;font-weight:800;line-height:1.15;text-align:center;white-space:nowrap}
.doc.st small{display:block;font-size:9.5px;font-weight:700;opacity:.75;letter-spacing:.8px;text-transform:uppercase;margin-bottom:1px}
.invs{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.doc.inv{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;text-align:left}
.doc.inv i{font-style:normal;color:var(--gold);font-weight:800;font-size:12px}
.doc.inv .il{display:flex;align-items:center;gap:9px;min-width:0}.doc.inv .ir{display:flex;align-items:center;gap:10px;white-space:nowrap}
.imo{font-size:11px;font-weight:800;color:var(--onGold);background:var(--gold);border-radius:7px;padding:3px 7px;white-space:nowrap}
.doc.inv em{font-style:normal;font-size:12.5px;font-weight:800;color:var(--txt)}
.doc.inv .il span{font-size:12.5px;color:var(--mut);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc.busy{opacity:.55;pointer-events:none}.doc.ready{background:var(--green)!important;color:#fff!important;border-color:var(--green)!important}
.docs .none{font-size:12px;color:var(--mut)}
footer{text-align:center;color:#555;font-size:11px;margin-top:26px}
</style>
</head>
<body>
<div class="pin" id="pin">
  <img src="logo.png" alt="Dento Art">
  <div class="t">Enter PIN</div>
  <div class="dots" id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="err" id="err"></div>
  <div class="pad" id="pad"></div>
</div>
<div class="wrap" id="app" hidden>
  <header><img src="logo.png" alt="Dento Art" id="lg"><div class="hr"><div class="upd" id="upd">Loading…</div><button class="th" id="th" aria-label="Theme">☀︎</button></div></header>
  <div class="hero">
    <div class="hl">Outstanding balances</div>
    <div class="tots" id="tots"></div>
    <div class="grand" id="grand"></div>
  </div>
  <div class="strip"></div>
  <div class="tabs" id="tabs"><button class="tab on" data-v="bal">Balances</button><button class="tab" data-v="pay">Payments</button><button class="tab" data-v="mamo">Mamo</button></div>
  <div class="tools"><input class="search" id="q" placeholder="Search clinic or doctor" autocomplete="off"><button class="btn" id="rf">↻</button></div>
  <div class="sorts" id="sorts"></div>
  <div class="list" id="list"><div class="msg">Loading…</div></div>
  <footer>Dento Art Dental Lab · Collections</footer>
</div>
<script>
const FEED = 'https://script.google.com/macros/s/AKfycbxzrkpanri4fZax5EbZDgDj324CAkcneQMxe3Ylcl_zPMP-Covk_-vPUgUWB3EFsptOFg/exec';
const CUR = ['USD','SAR','OMR','AED'];
const TO_USD = {USD:1, SAR:1/3.75, OMR:2.6, AED:1/3.6725};
const TO_AED = {USD:3.6725, SAR:3.6725/3.75, OMR:3.6725/0.3845, AED:1}; // pegged rates
const aed = (v,c) => fmt0(v*TO_AED[c]);
const fmt0 = n => n.toLocaleString('en-US',{maximumFractionDigits:0});
let data = null, curF = null, sortK = 'value', pinBuf = '', view = 'bal'; const openSet = new Set();
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} }, del(k){ try{localStorage.removeItem(k)}catch(e){} } };

function jsonp(url){ return new Promise((res,rej)=>{ const cb='cb'+Date.now()+Math.floor(Math.random()*1e4); const s=document.createElement('script');
  const t=setTimeout(()=>{cleanup();rej(new Error('timeout'))},20000);
  function cleanup(){clearTimeout(t);delete window[cb];s.remove()}
  window[cb]=d=>{cleanup();res(d)}; s.onerror=()=>{cleanup();rej(new Error('network'))};
  s.src=url+(url.includes('?')?'&':'?')+'callback='+cb; document.head.appendChild(s); }); }

async function load(pin){
  const d = await jsonp(FEED+'?key='+encodeURIComponent(pin));
  if(!d.ok) throw new Error(d.error||'error');
  return d;
}
function dmy(t){ const m=/(\d{2})\/(\d{2})\/(\d{4})/.exec(t||''); return m? m[3]+'-'+m[2]+'-'+m[1] : null; }
function since(iso){ return Math.max(0,Math.floor((Date.now()-new Date(iso+'T00:00:00'))/864e5)); }
function invSince(r){ return /invoiced/i.test(r.lastPayText||'') ? dmy(r.lastPayText) : null; }
function days(r){ if(invSince(r)) return null; let iso=r.lastPay||dmy(r.lastPayText); return iso? since(iso) : null; }
function renderPays(rows){
  const q=$('#q').value.trim().toLowerCase();
  const list = rows.filter(r=>r.d!==null&&(!curF||r.cur===curF)&&(!q||r.name.toLowerCase().includes(q))).sort((a,b)=>a.d-b.d||b.lastAmt-a.lastAmt);
  const grp = d => d<=7?'This week':d<=31?'This month':d<=92?'Last 3 months':'Earlier';
  let html='', last='';
  list.forEach((r,i)=>{ const g=grp(r.d); if(g!==last){ html+=`<div class="grp">${g}</div>`; last=g; }
    const ago = r.d===0?'today':r.d===1?'yesterday':r.d+' days ago';
    html+=`<div class="row" style="animation-delay:${Math.min(i,20)*18}ms"><div class="nm">${r.name.replace(/</g,'&lt;')}</div><div class="paid"><small>${r.cur}</small>+${fmt(r.lastAmt)}</div><div class="meta"><b>${r.lastPayText}</b> · ${ago}</div><span class="rem">Remaining <b>${r.cur} ${fmt(r.due)}</b></span></div>`; });
  $('#list').innerHTML = html || '<div class="empty">No payments</div>';
}
let mamoD=null, mamoAt=0, mamoBusy=false;
function dshort(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}); }
function inDays(iso){ const t=new Date(); t.setHours(0,0,0,0); const n=Math.round((new Date(iso+'T00:00:00')-t)/864e5); return n<=0?'today':n===1?'tomorrow':'in '+n+' days'; }
async function loadMamo(force){ if(mamoBusy) return; if(!force && mamoD && Date.now()-mamoAt<60000) return renderMamo();
  mamoBusy=true; if(!mamoD) $('#list').innerHTML='<div class="msg">Loading Mamo…</div>';
  try{ const d=await jsonp(FEED+'?key='+encodeURIComponent(store.get('pin')||'')+'&mamo=1'); mamoD=d; mamoAt=Date.now(); }catch(e){ mamoD=mamoD||{ok:false,error:'network'}; }
  mamoBusy=false; if(view==='mamo') renderMamo(); }
function renderMamo(){ const d=mamoD; if(!d) return;
  if(!d.ok){ $('#list').innerHTML=`<div class="msg">Mamo not connected yet (${d.error||'error'})</div>`; return; }
  const who=x=>{ let t=(x.what||'').split(' - ')[0].split(' | ')[0].trim(); if(/^untitled/i.test(t)) t=''; return (t||x.name||'—').replace(/</g,'&lt;'); };
  const st=x=> x.status==='captured' ? (x.refund>0?'<span class="mst ref">Refunded</span>':'<span class="mst ok">Paid</span>') : `<span class="mst bad">${x.status}</span>`;
  let h=`<div class="mhero"><div class="ml1">Waiting at Mamo → your bank</div><div class="mv1"><small>AED</small>${fmt(d.pending)}</div><div class="ms">${d.upcoming.length?`${d.upcoming.length} transfer${d.upcoming.length>1?'s':''} coming · next ${dshort(d.upcoming[0].date)} (${inDays(d.upcoming[0].date)})`:'Nothing pending — all settled'} · live ${d.at}</div></div>`;
  h+=`<div class="mgrid"><div class="mbox"><div class="k">This month · net AED</div><div class="v"><small>AED</small>${fmt(d.month.gross)}</div></div><div class="mbox"><div class="k">Payments this month</div><div class="v">${d.month.count}</div></div></div>`;
  if(d.upcoming.length){ h+='<div class="grp">Coming to your bank</div>'+d.upcoming.map(u=>`<div class="payout"><span><b>${dshort(u.date)}</b><span class="pd">${inDays(u.date)}</span></span><span class="pa">AED ${fmt(u.amount)}</span></div>`).join(''); }
  h+='<div class="grp">Latest Mamo payments</div>'+d.recent.filter(x=>x.status==='captured').map((x,i)=>`<div class="row mp" style="animation-delay:${Math.min(i,20)*18}ms"><div class="nm">${who(x)}</div><div class="paid"><small>${x.cur}</small>${x.status==='captured'?'+':''}${fmt(x.amount)}</div><div class="meta"><b>${x.at.slice(8,10)}/${x.at.slice(5,7)}/${x.at.slice(0,4)}</b> ${x.at.slice(11)} · ${x.method||''}${x.status==='captured'&&x.settle?` · bank ${x.settle.slice(8,10)}/${x.settle.slice(5,7)}`:''}</div></div>`).join('');
  $('#list').innerHTML=h; }
setInterval(()=>{ if(view==='mamo' && !document.hidden) loadMamo(true); },60000);
function render(){
  if(!data) return;
  const rows = data.rows.map(r=>({...r, d:days(r)}));
  // totals
  $('#tots').innerHTML = CUR.map(c=>{ const rs=rows.filter(r=>r.cur===c); const s=rs.reduce((a,r)=>a+r.due,0);
    return `<div class="tot ${curF===c?'on':''}" data-c="${c}"><div class="c">${c}</div><div class="v">${fmt(s)}</div><div class="n">${rs.length} client${rs.length===1?'':'s'}</div>${c!=='AED'?`<div class="aedt">≈ AED ${aed(s,c)}</div>`:''}</div>`}).join('');
  document.querySelectorAll('.tot').forEach(el=>el.onclick=()=>{curF = curF===el.dataset.c?null:el.dataset.c; render();});
  const gAll = rows.reduce((a,r)=>a+r.due*TO_AED[r.cur],0);
  $('#grand').innerHTML = `<div class="gl">Total outstanding<small>All currencies · ${rows.length} clients</small></div><div class="gv"><small>≈ AED</small>${fmt0(gAll)}</div>`;
  document.querySelectorAll('.tab').forEach(t=>{ t.classList.toggle('on', t.dataset.v===view); t.onclick=()=>{ view=t.dataset.v; render(); }; });
  $('#sorts').style.display = view==='bal' ? '' : 'none';
  document.querySelector('.tools').style.display = view==='mamo' ? 'none' : '';
  if(view==='mamo'){ if(mamoD) renderMamo(); loadMamo(false); stamp(); return; }
  if(view==='pay'){ renderPays(rows); stamp(); return; }
  const sorts=[['value','Highest'],['days','Longest unpaid'],['name','A–Z']];
  $('#sorts').innerHTML = sorts.map(([k,l])=>`<span class="chip ${sortK===k?'on':''}" data-k="${k}">${l}</span>`).join('') + (curF?`<span class="chip on" data-x="1">${curF} ✕</span>`:'');
  document.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{ if(el.dataset.x){curF=null}else{sortK=el.dataset.k} render(); });
  const q=$('#q').value.trim().toLowerCase();
  let list = rows.filter(r=>(!curF||r.cur===curF)&&(!q||r.name.toLowerCase().includes(q)));
  if(sortK==='value') list.sort((a,b)=>b.due*TO_USD[b.cur]-a.due*TO_USD[a.cur]);
  if(sortK==='days'){ const k=r=> r.d!==null? r.d : (invSince(r)? since(invSince(r)) : 1e9); list.sort((a,b)=>k(b)-k(a)); }
  if(sortK==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
  $('#list').innerHTML = list.length ? list.map((r,i)=>{
    const inv = invSince(r), invD = inv? since(inv) : null;
    const dd = r.d!==null ? r.d : invD;
    const cls = dd===null?'r':dd<=30?'g':dd<=60?'o':'r';
    const badge = dd===null?'—':(dd===0?'Today':dd+' days');
    const lp = (r.d!==null) ? `Last paid <b>${r.lastPayText}</b>${r.lastAmt?` · ${fmt(r.lastAmt)}`:''}` : (inv? `No payment yet · invoiced since <b>${inv.split('-').reverse().join('/')}</b>` : 'No payment yet');
    const ms=(r.months||[]).filter(m=>m[1]>0), mx=Math.max(1,...ms.map(m=>m[1])), cr=(r.months||[]).filter(m=>m[1]<0);
    const det=`<div class="det">${ms.map(m=>`<div class="mrow"><span class="ml">${m[0]}</span><span class="mb"><i style="width:${Math.max(4,Math.round(m[1]/mx*100))}%"></i></span><span class="mv">${fmt(m[1])}</span></div>`).join('')}${cr.map(m=>`<div class="mrow cr"><span class="ml">Credit</span><span class="mb"></span><span class="mv">${fmt(m[1])}</span></div>`).join('')}<div class="dsum">${ms.length} month${ms.length===1?'':'s'} unpaid${ms.length?` · oldest <b>${ms[ms.length-1][0]}</b>`:''}</div>${docsHtml(r)}</div>`;
    return `<div class="row ${openSet.has(r.name)?'open':''}" data-n="${encodeURIComponent(r.name)}" style="animation-delay:${Math.min(i,20)*18}ms"><div class="nm"><span class="chev">›</span>${r.name.replace(/</g,'&lt;')}</div><div class="amt"><small>${r.cur}</small>${fmt(r.due)}${r.cur!=='AED'?`<span class="aed">≈ AED ${aed(r.due,r.cur)}</span>`:''}</div><div class="meta">${lp}</div><span class="badge ${cls}">${badge}</span>${det}</div>`;
  }).join('') : '<div class="empty">No matches</div>';
  document.querySelectorAll('#list .row[data-n]').forEach(el=>el.onclick=()=>{ const n=decodeURIComponent(el.dataset.n); if(openSet.has(n)) openSet.delete(n); else openSet.add(n); el.classList.toggle('open'); });
  stamp();
}
const ST={ '3m':'Statement · 3 months','ytd':'Statement · this year','full':'Statement · full' };
function docInfo(n){ const p=n.split('__'); if(p[1]&&/^statement-(3m|ytd|full)\.pdf$/.test(p[1])){ const k=p[1].slice(10,-4); return {k:'s'+k, o:({'3m':0,'ytd':1,'full':2})[k], label:ST[k], st:true}; }
  if(p[1]==='inv'&&p[2]){ const no=p[2].replace(/\.pdf$/,''), ym=(p[3]||'').replace(/\.pdf$/,''), bal=p[4]?parseFloat(p[4]):null;
    const mo=/^\d{4}-\d{2}$/.test(ym)? new Date(ym+'-01T00:00:00').toLocaleDateString('en-GB',{month:'short',year:'numeric'}) : '';
    return {k:'i', o:10, ym:ym, label:'Invoice '+no, mo:mo, bal:bal, st:false}; } return null; }
function docsHtml(r){ const ds=(r.docs||[]).map(d=>({...d,...(docInfo(d.name)||{})})).filter(d=>d.label);
  if(!ds.length) return `<div class="docs"><span class="none">Documents not ready yet</span></div>`;
  const st=ds.filter(d=>d.st).sort((a,b)=>a.o-b.o), inv=ds.filter(d=>!d.st).sort((a,b)=>(a.ym||'').localeCompare(b.ym||'')||a.label.localeCompare(b.label));
  const SL={'s3m':'3 Months','sytd':'This Year','sfull':'Full'}, up=ds[0].updated?` <span>· updated ${ds[0].updated}</span>`:'';
  return `<div class="docs"><div class="dl">Statement${up}</div><div class="sts">${st.map(d=>`<button class="doc st" data-f="${encodeURIComponent(d.name)}"><small>PDF</small>${SL[d.k]||d.label}</button>`).join('')}</div>`+
    (inv.length?`<div class="dl" style="margin-top:12px">Open invoices · ${inv.length}</div><div class="invs">${inv.map(d=>`<button class="doc inv" data-f="${encodeURIComponent(d.name)}"><span class="il">${d.mo?`<b class="imo">${d.mo}</b>`:''}<span>${d.label}</span></span><span class="ir">${d.bal!=null?`<em>${r.cur} ${fmt(d.bal)}</em>`:''}<i>PDF ↓</i></span></button>`).join('')}</div>`:`<div class="dl" style="margin-top:12px">No open invoices</div>`)+`</div>`; }
const fileCache={};
function niceName(n){ const p=n.split('__'), i=docInfo(n); return (p[0]+' - '+(i?i.label.replace(' · ',' '):'doc')).replace(/[\\/:*?"<>|]/g,'')+'.pdf'; }
async function deliver(btn, f){ const file=fileCache[f];
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file]}); btn.classList.remove('ready'); return; }catch(e){ if(e.name==='AbortError'){btn.classList.remove('ready');return;} btn.classList.add('ready'); btn.dataset.lbl=btn.dataset.lbl||btn.innerHTML; btn.innerHTML='Tap to open ↗'; return; } }
  const u=URL.createObjectURL(file), a=document.createElement('a'); a.href=u; a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000); btn.classList.remove('ready'); }
async function openDoc(btn){ const f=decodeURIComponent(btn.dataset.f);
  if(fileCache[f]){ await deliver(btn,f); if(btn.dataset.lbl&&!btn.classList.contains('ready')) btn.innerHTML=btn.dataset.lbl; return; }
  const lbl=btn.innerHTML; btn.dataset.lbl=lbl; btn.classList.add('busy'); btn.innerHTML='Loading…';
  try{ const d=await jsonp(FEED+'?key='+encodeURIComponent(store.get('pin')||'')+'&file='+encodeURIComponent(f)); if(!d.ok) throw new Error(d.error);
    const bin=atob(d.b64), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    fileCache[f]=new File([u8],niceName(f),{type:'application/pdf'}); btn.classList.remove('busy'); btn.innerHTML=lbl; await deliver(btn,f);
  }catch(e){ btn.classList.remove('busy'); btn.innerHTML='Failed — tap again'; setTimeout(()=>btn.innerHTML=lbl,2500); } }
document.addEventListener('click',e=>{ const b=e.target.closest('.doc'); if(!b) return; e.stopPropagation(); openDoc(b); },true);
function stamp(){
  const u = data.updated ? new Date(data.updated) : null;
  $('#upd').innerHTML = `Live from the tracker<br><b>${u?u.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):''}</b>`;
}
async function refresh(){
  $('#upd').textContent='Updating…';
  try{ data = await load(store.get('pin')); render(); }
  catch(e){ if(e.message==='bad_pin'){ store.del('pin'); showPin(); } else { $('#upd').textContent='Offline – tap ↻'; } }
}
function showPin(){
  $('#app').hidden=true; $('#pin').style.display='flex'; pinBuf=''; drawDots();
  $('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('');
  document.querySelectorAll('#pad button').forEach(b=>b.onclick=()=>press(b.dataset.k));
}
function drawDots(){ document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('f',i<pinBuf.length)); }
async function press(k){
  if(k==='⌫'){ pinBuf=pinBuf.slice(0,-1); drawDots(); return; }
  if(pinBuf.length>=4) return;
  pinBuf+=k; drawDots(); $('#err').textContent='';
  if(pinBuf.length===4){
    try{ data = await load(pinBuf); store.set('pin',pinBuf); $('#pin').style.display='none'; $('#app').hidden=false; render(); }
    catch(e){ $('#err').textContent = e.message==='bad_pin'?'Wrong PIN':'Connection problem'; $('#dots').classList.add('shake'); setTimeout(()=>{$('#dots').classList.remove('shake');pinBuf='';drawDots();},450); }
  }
}
document.addEventListener('keydown',e=>{ if($('#pin').style.display!=='none'){ if(/^[0-9]$/.test(e.key)) press(e.key); if(e.key==='Backspace') press('⌫'); }});
$('#q').oninput=render; $('#rf').onclick=refresh;
function applyTheme(t){ if(t==='light') document.documentElement.dataset.theme='light'; else delete document.documentElement.dataset.theme;
  $('#th').textContent = t==='light' ? '☾' : '☀︎'; document.querySelector('meta[name=theme-color]').content = t==='light' ? '#f6f5f2' : '#0a0a0a'; }
applyTheme(store.get('theme')==='light'?'light':'dark');
$('#th').onclick=()=>{ const t=document.documentElement.dataset.theme==='light'?'dark':'light'; store.set('theme',t); applyTheme(t); };
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && store.get('pin')) refresh(); });
if(store.get('pin')){ $('#pin').style.display='none'; $('#app').hidden=false; refresh(); } else showPin();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
